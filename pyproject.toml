[project]
name = "loupe"
version = "0.1.0"
description = "Sorts an Apple Photos library into content pillars using local embeddings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "osxphotos",
    "open-clip-torch",
    "torch",
    "pillow",
    "pillow-heif",
    "numpy",
    "scikit-learn",
    "typer",
    "rich",
    "imageio-ffmpeg",
    "python-dotenv",
    "pydantic>=2.14.3",
    "pyobjc-framework-photos==13.0",
    "pyobjc-framework-security==13.0",
    "pyobjc-framework-webkit==13.0",
]

[project.optional-dependencies]
# transcribe: M8. secondpass (anthropic): M10 on. mcp: later.
mcp = ["mcp"]
transcribe = ["mlx-whisper"]
secondpass = ["anthropic"]

[project.scripts]
loupe = "loupe.cli:app"

[dependency-groups]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
