name: Loupe
options:
  bundleIdPrefix: app.loupe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Loupe:
    type: application
    platform: iOS
    sources: [Loupe]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loupe.ios
        PRODUCT_NAME: Loupe
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Loupe/Info.plist
    info:
      path: Loupe/Info.plist
      properties:
        CFBundleDisplayName: Loupe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Loupe sorts your photos and videos into your content pillars.
        ITSAppUsesNonExemptEncryption: false
        LoupeServerURL: https://loupe-server-production.up.railway.app
        LoupeWebURL: https://loupe-web.up.railway.app
